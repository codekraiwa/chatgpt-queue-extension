<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ChatGPT Queue</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-copy">
      <h1 id="page-title">ChatGPT Queue</h1>
      <div id="summary" class="summary-row"></div>
    </div>
    <div class="top-actions">
      <button id="settings-btn" class="icon-button" title="Settings" aria-label="Settings">⚙</button>
      <button id="refresh" class="icon-button" title="Refresh" aria-label="Refresh">↻</button>
    </div>
  </header>

  <main id="tabs-view">
    <div id="tabs" class="tab-list"></div>
  </main>

  <main id="settings-view" class="settings-view hidden">
    <div class="settings-card">
      <div class="settings-title">Notifications & sound</div>
      <label class="setting-row"><span><strong>Notify when finished</strong><small>Show a Chrome notification when a response completes.</small></span><input id="setting-notify" type="checkbox"></label>
      <label class="setting-row"><span><strong>Only when tab isn't active</strong><small>Suppress completion notifications while you are already viewing that tab.</small></span><input id="setting-inactive" type="checkbox"></label>
      <label class="setting-row"><span><strong>Completion sound</strong><small>Play a two-tone beep even when ChatGPT is in a background tab.</small></span><input id="setting-sound" type="checkbox"></label>
      <div class="settings-actions">
        <button id="test-notification" class="wide-button secondary">Test notification</button>
        <button id="test-sound" class="wide-button secondary">Test sound</button>
      </div>
      <p id="settings-status" class="settings-note"></p>
      <button id="back-btn" class="wide-button">Back to tabs</button>
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
