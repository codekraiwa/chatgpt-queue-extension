name: Build Extension Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(python -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: |
          mkdir -p release/package
          rsync -av --exclude '.git' --exclude '.github' --exclude 'release' --exclude '*.zip' ./ release/package/
          cd release/package
          zip -r "../chatgpt-queue-extension-v${{ steps.version.outputs.version }}.zip" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/chatgpt-queue-extension-v${{ steps.version.outputs.version }}.zip
